spring:
  application:
    name: sba-project
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rental
        jdbc:
          time_zone: UTC
        temp:
          use_jdbc_metadata_defaults: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cleanup-initial-delay-ms: ${JWT_TOKEN_CLEANUP_INITIAL_DELAY_MS:3600000}
    cleanup-interval-ms: ${JWT_TOKEN_CLEANUP_INTERVAL_MS:3600000}
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: 'OFF'
