spring:
  application:
    name: sba-project
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rental
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: 'OFF'
