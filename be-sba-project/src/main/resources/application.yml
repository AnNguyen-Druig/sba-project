spring:
  application:
    name: sba-project
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: "HtD22012005*#@"
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rental
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
        jdbc:
          time_zone: UTC
        temp:
          use_jdbc_metadata_defaults: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
app:
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  mail:
    from: ${SMTP_FROM:no-reply@example.com}
    verification-expiration-ms: ${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
  jwt:
    expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cleanup-initial-delay-ms: ${JWT_TOKEN_CLEANUP_INITIAL_DELAY_MS:3600000}
    cleanup-interval-ms: ${JWT_TOKEN_CLEANUP_INTERVAL_MS:3600000}
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: 'OFF'
