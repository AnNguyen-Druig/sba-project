spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    com.sba.project.common.exceptions.GlobalExceptionHandler: DEBUG
app:
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
